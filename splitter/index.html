<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>image splitter</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #fff;
      color: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: min(1200px, 92%);
      margin: 0 auto;
    }

    .header { border-bottom: 1px solid #e9e9e9; }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 0;
    }

    .logo { font-size: 22px; font-weight: 800; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .upload,
    select,
    button {
      border: 2px solid #111;
      background: #fff;
      color: #111;
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
      font: inherit;
      cursor: pointer;
    }

    .upload { position: relative; overflow: hidden; }

    .upload input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    button {
      background: #111;
      color: #fff;
    }

    button:hover {
      background: #fff;
      color: #111;
    }

    .upload:hover,
    select:hover {
      background: #111;
      color: #fff;
    }

    .hero { padding: 40px 0 20px; }

    .hero-box {
      border: 1px solid #111;
      border-radius: 6px;
      padding: 26px;
    }

    .preview {
      padding: 20px 0 60px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      border: 1px solid #111;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .card canvas {
      width: 100%;
      display: block;
    }

    .empty {
      padding: 60px 20px;
      border: 1px dashed #111;
      border-radius: 6px;
      text-align: center;
      margin-top: 20px;
    }

    .hidden { display: none; }

    @media (max-width: 700px) {
      .controls { width: 100%; }
      .upload, select, button { width: 100%; }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="container header-inner">

    <div class="logo">image tool</div>

    <div class="controls">

      <label class="upload">
        upload
        <input type="file" id="imageInput" accept="image/*">
      </label>

      <select id="mode">
        <option value="split">split grid</option>
        <option value="tile">tile grid</option>
        <option value="resize">resize only</option>
      </select>

      <select id="splitCount">
        <option value="2">x2</option>
        <option value="4" selected>x4</option>
        <option value="9">x9</option>
        <option value="16">x16</option>
      </select>

      <select id="tileSize">
        <option value="8">8x8</option>
        <option value="16">16x16</option>
        <option value="32">32x32</option>
        <option value="64">64x64</option>
        <option value="100" selected>100x100</option>
        <option value="128">128x128</option>
        <option value="256">256x256</option>
        <option value="512">512x512</option>
        <option value="1024">1024x1024</option>
      </select>

      <button id="downloadBtn">download</button>

    </div>

  </div>
</header>

<section class="hero">
  <div class="container">
    <div class="hero-box">
      <h1>image processor</h1>
      <p>split / tile / resize</p>
    </div>
  </div>
</section>

<div class="container">

  <div class="empty" id="emptyText">no image yet</div>
  <div class="preview" id="preview"></div>

</div>

<script>
  const imageInput = document.getElementById("imageInput");
  const mode = document.getElementById("mode");
  const splitCount = document.getElementById("splitCount");
  const tileSizeSelect = document.getElementById("tileSize");
  const preview = document.getElementById("preview");
  const emptyText = document.getElementById("emptyText");
  const downloadBtn = document.getElementById("downloadBtn");

  let canvases = [];
  let currentImg = null;

  imageInput.addEventListener("change", handleImage);
  mode.addEventListener("change", () => currentImg && split(currentImg));
  splitCount.addEventListener("change", () => currentImg && split(currentImg));
  tileSizeSelect.addEventListener("change", () => currentImg && split(currentImg));

  function handleImage() {
    const file = imageInput.files[0];
    if (!file) return;

    const img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = () => {
      currentImg = img;
      split(img);
    };
  }

  function split(img) {
    preview.innerHTML = "";
    canvases = [];
    emptyText.classList.add("hidden");

    const m = mode.value;

    // 1) SPLIT GRID
    if (m === "split") {
      const parts = Number(splitCount.value);
      const grid = Math.sqrt(parts);

      const cellW = img.width / grid;
      const cellH = img.height / grid;

      const tileSize = Number(tileSizeSelect.value);

      for (let y = 0; y < grid; y++) {
        for (let x = 0; x < grid; x++) {

          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          canvas.width = tileSize;
          canvas.height = tileSize;

          ctx.drawImage(
            img,
            x * cellW, y * cellH, cellW, cellH,
            0, 0, tileSize, tileSize
          );

          add(canvas);
        }
      }
    }

    // 2) TILE GRID (fixed chunks)
    if (m === "tile") {
      const tileSize = Number(tileSizeSelect.value);

      const cols = Math.ceil(img.width / tileSize);
      const rows = Math.ceil(img.height / tileSize);

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {

          const sx = x * tileSize;
          const sy = y * tileSize;

          const sw = Math.min(tileSize, img.width - sx);
          const sh = Math.min(tileSize, img.height - sy);

          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          canvas.width = tileSize;
          canvas.height = tileSize;

          ctx.drawImage(
            img,
            sx, sy, sw, sh,
            0, 0, tileSize, tileSize
          );

          add(canvas);
        }
      }
    }

    // 3) RESIZE ONLY (1 image)
    if (m === "resize") {
      const tileSize = Number(tileSizeSelect.value);

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = tileSize;
      canvas.height = tileSize;

      ctx.drawImage(
        img,
        0, 0, img.width, img.height,
        0, 0, tileSize, tileSize
      );

      add(canvas);
    }
  }

  function add(canvas) {
    const card = document.createElement("div");
    card.className = "card";
    card.appendChild(canvas);

    preview.appendChild(card);
    canvases.push(canvas);
  }

  downloadBtn.addEventListener("click", async () => {
    if (!canvases.length) return;

    for (let i = 0; i < canvases.length; i++) {
      const a = document.createElement("a");
      a.href = canvases[i].toDataURL("image/png");
      a.download = `output-${i + 1}.png`;

      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      await new Promise(r => setTimeout(r, 60));
    }
  });
</script>

</body>
</html>
